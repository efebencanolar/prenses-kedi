<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esra'nın Odası - Talking Tom Modu</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffb6c1;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            padding-top: 30px;
        }
        .room-title {
            text-align: center;
            padding: 15px;
            font-size: 28px;
            color: #ffb6c1;
            text-shadow: 2px 2px 4px #000;
        }
        .cat-container {
            margin-top: 40px;
        }
        .cat-box {
            display: inline-block;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 20px;
            border: 3px solid #777;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .cat-box:hover {
            transform: scale(1.03);
        }
        @keyframes hitEffect {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-20px, 15px) rotate(-12deg); filter: brightness(1.4) sepia(0.5); }
            30% { transform: translate(20px, -15px) rotate(12deg); }
            45% { transform: translate(-10px, 8px) rotate(-6deg); }
            60% { transform: translate(10px, -5px) rotate(6deg); }
            75% { transform: translate(-5px, 3px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); filter: none; }
        }
        .hit-animation {
            animation: hitEffect 0.5s ease-in-out;
        }
        .cat-info {
            margin-top: 15px;
            font-size: 20px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        .help-text {
            margin-top: 30px;
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="room-title">Esra'nın Odası 🐾</div>

    <div class="cat-container">
        <div class="cat-box" onclick="hitTheCat()">
            <img id="myCatImage" src="kedi.jpg" alt="Prenses" style="width: 250px; height: auto; border-radius: 15px; border: 2px solid #555;">
            <div class="cat-info">prenses</div>
        </div>
    </div>

    <p class="help-text">Kediciğe vurup ses çıkarmak için üzerine tıkla!</p>

    <audio id="tom_sound">
        <source src="tom_ses.mp3" type="audio/mpeg">
        Tarayıcın ses etiketini desteklemiyor.
    </audio>

    <script>
        function hitTheCat() {
            var img = document.getElementById('myCatImage');
            var sound = document.getElementById('tom_sound');
            
            sound.currentTime = 0;
            sound.play();

            img.classList.remove('hit-animation');
            void img.offsetWidth;
            img.classList.add('hit-animation');
        }
    </script>

</body>
</html>
